[package]
name = "tivilite-desktop"
version = "2.1.0"
description = "TiviLite Desktop - Lightweight Cross-Platform IPTV & Media Player for Windows, macOS, and Linux"
authors = ["TiviLite Dev Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2.0.0"
tauri-plugin-window-state = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = true
