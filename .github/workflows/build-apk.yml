name: Build TiviLite Android TV APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'
        cache-disabled: true

    - name: Build APK (Release & Debug with Fixed Signature)
      run: |
        gradle assembleRelease --stacktrace 2>&1 | tee /tmp/build.log || \
        gradle assembleDebug --stacktrace 2>&1 | tee /tmp/build.log || {
          echo "==================== BUILD ERROR OUTPUT ===================="
          tail -n 150 /tmp/build.log
          exit 1
        }

    - name: Prepare APK for Release
      run: |
        TAG_NAME="${{ github.ref_name }}"
        if [ -z "$TAG_NAME" ] || [ "$TAG_NAME" = "main" ]; then
          TAG_NAME="latest"
        fi
        APK_FOUND=$(find app/build/outputs/apk/ -type f -name "*.apk" | head -n 1)
        if [ -n "$APK_FOUND" ]; then
          echo "Found APK at $APK_FOUND"
          cp "$APK_FOUND" "TiviLite-${TAG_NAME}.apk"
          echo "APK_FILE=TiviLite-${TAG_NAME}.apk" >> $GITHUB_ENV
        else
          echo "No APK found in app/build/outputs/apk/"
          find . -name "*.apk"
          exit 1
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TiviLite-AndroidTV-APK
        path: ${{ env.APK_FILE }}
        retention-days: 30

    - name: Create GitHub Release on Tag
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: ${{ env.APK_FILE }}
        name: TiviLite ${{ github.ref_name }} (Android TV 纯净播放器)
        body: |
          ## 📺 TiviLite ${{ github.ref_name }} (极客与家庭互联体验版)

          专为大屏打造的 Android TV / 电视机顶盒专用纯净 IPTV 播放器。

          ### ✨ v1.1.0 第三阶段核心亮点与深度优化：
          - 📱 **手机 Web 虚拟触控遥控器**：扫码即可在手机浏览器打开虚拟遥控器，方向键/选台/音量/换线/菜单/收藏/直达换台全功能触控控制，支持触控震动反馈。
          - 📺 **大屏与手机实时双向互联**：手机网页实时同步大屏当前播放频道、线路、解码方式、EPG当前节目名称与时段。
          - 📑 **手机端全频道点播与即搜即播**：在手机上直接浏览电视内所有聚合的频道，输入频道名或台号即搜即点，大屏秒切对应频道。
          - 🎬 **边看边选实时节目单 (TiviMate 旗舰体验)**：左侧频道抽屉滚动浏览时，实时显示各频道当前播出的真实节目名称，主画面不中断。
          - 🚀 **华为智慧屏与低功耗 TV 兼容优化**：硬件加速硬解与软件兼容解码双引擎自适应，屏幕常亮防休眠屏保。
          - 🔄 **官方稳定统一签名**：覆盖安装免卸载，支持应用内检测与无缝在线升级。

          ### 📥 安装方式：
          下载下方的 APK 安装包，通过 U 盘或局域网助手直接安装到电视/机顶盒即可！
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
