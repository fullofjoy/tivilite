name: Build TiviLite Android TV APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Build APK (Release & Debug with Fixed Signature)
      run: gradle assembleRelease --stacktrace || gradle assembleDebug --stacktrace

    - name: Prepare APK for Release
      run: |
        TAG_NAME="${{ github.ref_name }}"
        if [ -z "$TAG_NAME" ] || [ "$TAG_NAME" = "main" ]; then
          TAG_NAME="latest"
        fi
        APK_FOUND=$(find app/build/outputs/apk/ -type f -name "*.apk" | head -n 1)
        if [ -n "$APK_FOUND" ]; then
          echo "Found APK at $APK_FOUND"
          cp "$APK_FOUND" "TiviLite-${TAG_NAME}.apk"
          echo "APK_FILE=TiviLite-${TAG_NAME}.apk" >> $GITHUB_ENV
        else
          echo "No APK found in app/build/outputs/apk/"
          find . -name "*.apk"
          exit 1
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TiviLite-AndroidTV-APK
        path: ${{ env.APK_FILE }}
        retention-days: 30

    - name: Create GitHub Release on Tag
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: ${{ env.APK_FILE }}
        name: TiviLite ${{ github.ref_name }} (Android TV 纯净播放器)
        body: |
          ## 📺 TiviLite ${{ github.ref_name }} (多源聚合与自适应解码版)

          专为大屏打造的 Android TV / 电视机顶盒专用纯净 IPTV 播放器。

          ### ✨ v1.0.9 第二阶段核心亮点与深度优化：
          - 🎬 **硬件解码 / 软件兼容解码无缝切换**：设置菜单中新增「解码器模式」切换，针对老旧华为/小米电视 SoC 解决音画不同步、黑屏或花屏问题，支持软硬解无感重载。
          - 📁 **多订阅源管理与同名频道聚合 (Multi-Subscription)**：支持同时保存多套 M3U/TXT 订阅源（如 IPv6 专线 + 地方台源 + 自定义源），手机端可随时管理/停用/删除，大屏自动对同名频道合并为多线路备用源。
          - 📺 **全国卫视与央视 EPG 节目单网络实时同步**：接入标准 DIYP 节目单接口，OSD 实时显示当前播出节目名称，右侧 7 天时移抽屉展示真实电视节目单。
          - ⭐ **保留所有经典特性**：频道一键收藏置顶、开机自启直达、遥控器 0-9 选台、切台方向反转。
          - 🔄 **官方稳定统一签名**：覆盖安装免卸载，支持应用内检测静默/在线升级。

          ### 📥 安装方式：
          下载下方的 APK 安装包，通过 U 盘或局域网助手直接安装到电视/机顶盒即可！
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
