name: Build TiviLite Android TV APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'
        cache-disabled: true

    - name: Build APK (Release with Fixed Signature)
      run: |
        gradle assembleRelease --stacktrace > build_release.log 2>&1
        echo "### Release Build Log Tail" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        tail -n 100 build_release.log >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY

    - name: Push Build Log to Debug Branch
      if: always()
      run: |
        git config user.name "github-actions"
        git config user.email "actions@github.com"
        git checkout -B debug-log
        cp build_release.log debug-build.log
        git add debug-build.log
        git commit -m "debug: build log" || true
        git push origin debug-log --force || true

    - name: Upload Build Logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: gradle-build-logs
        path: |
          build_release.log
          build_debug.log

    - name: Prepare APK for Release
      run: |
        TAG_NAME="${{ github.ref_name }}"
        if [ -z "$TAG_NAME" ] || [ "$TAG_NAME" = "main" ]; then
          TAG_NAME="latest"
        fi
        APK_FOUND=$(find app/build/outputs/apk/release/ -type f -name "*.apk" | head -n 1)
        if [ -z "$APK_FOUND" ]; then
          APK_FOUND=$(find app/build/outputs/apk/ -type f -name "*.apk" | head -n 1)
        fi
        if [ -n "$APK_FOUND" ]; then
          echo "Found APK at $APK_FOUND"
          cp "$APK_FOUND" "TiviLite-${TAG_NAME}.apk"
          echo "APK_FILE=TiviLite-${TAG_NAME}.apk" >> $GITHUB_ENV
        else
          echo "No APK found in app/build/outputs/apk/"
          find . -name "*.apk"
          exit 1
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TiviLite-AndroidTV-APK
        path: ${{ env.APK_FILE }}
        retention-days: 30

    - name: Create GitHub Release on Tag
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: ${{ env.APK_FILE }}
        name: TiviLite ${{ github.ref_name }} (Android TV 纯净播放器)
        body: |
          ## 📺 TiviLite ${{ github.ref_name }} (Android TV 旗舰大屏播放器)

          专为大屏打造的 Android TV / 电视机顶盒专用纯净 IPTV & 本地原盘播放器。

          ### ✨ 核心亮点与创新特性：
          - 🎬 **蓝光原盘 (BDMV/ISO) 与杜比视界 Profile 7/8 色彩映射**：自动智能探测并直放超高清最大码率 m2ts 流文件，杜比视界 HDR 动态映射杜绝偏色发灰。
          - 🤖 **端侧本地大模型智能全场景影音助手**：支持自然语言多跳语义查询、年代与演员智能推荐，一键精准直达匹配播放。
          - ⚡ **P2P 分布式边缘流媒体加速网络**：局域网分块协同预取与命中缓存，大幅降低公网带宽并消除大码率卡顿。
          - 🤖 **AI 智能实时字幕与双语同传**：多语种毫秒级识别与即时翻译，支持双语并显与专属发音时钟对齐。
          - ⚡ **WebRTC 极速低延迟与局域网多屏同步**：多台电视同播零回声，毫秒级时钟动态补偿。
          - ☁️ **Cloud Mesh 局域网自组网与跨屏流转接力**：客厅看一半，一键无缝推流接力到卧室电视。
          - 📁 **本地存储与 SMB/NAS 私有云直连挂载**：全自动扫描并挂载本地与网络影视资源。
          - 📶 **双网卡智能聚合与全链路竞速**：有线 + 无线双通道同时测速，自动分流提速并毫秒级无感容灾。
          - 🎨 **大屏沉浸主题与动态字号引擎**：深邃黑曜、极光蓝调等 5 种沉浸视效，无极调节适合长辈。
          - 📲 **手机 Web 虚拟触控遥控器与配源中心**：免装 App 扫码即控，全功能虚拟遥控、配源与 AI 问答直达。
          - 🛡️ **官方持久统一签名** (SHA256: `5B:A6:...`)：零配置覆盖安装，全版本无缝平滑热更新。

          ### 📥 安装方式：
          下载下方的 APK 安装包，通过 U 盘或局域网助手直接安装到电视/机顶盒即可！
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
