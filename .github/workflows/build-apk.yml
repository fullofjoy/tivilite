name: Build TiviLite Android TV APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Build APK (Release & Debug with Fixed Signature)
      run: gradle assembleRelease --stacktrace || gradle assembleDebug --stacktrace

    - name: Prepare APK for Release
      run: |
        TAG_NAME="${{ github.ref_name }}"
        if [ -z "$TAG_NAME" ] || [ "$TAG_NAME" = "main" ]; then
          TAG_NAME="latest"
        fi
        if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
          cp app/build/outputs/apk/release/app-release.apk "TiviLite-${TAG_NAME}.apk"
        else
          cp app/build/outputs/apk/debug/app-debug.apk "TiviLite-${TAG_NAME}.apk"
        fi
        echo "APK_FILE=TiviLite-${TAG_NAME}.apk" >> $GITHUB_ENV

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TiviLite-AndroidTV-APK
        path: ${{ env.APK_FILE }}
        retention-days: 30

    - name: Create GitHub Release on Tag
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: ${{ env.APK_FILE }}
        name: TiviLite ${{ github.ref_name }} (Android TV 纯净播放器)
        body: |
          ## 📺 TiviLite ${{ github.ref_name }} 优化版本发布
          
          专为大屏打造的 Android TV / 电视机顶盒专用 IPTV 播放器。
          
          ### ✨ 本版核心亮点与优化：
          - ⚡ **开机直启 & 频道记忆**：电视开机自动启动，自动恢复上次观看频道，长辈小孩免操作。
          - 📱 **手机扫码免遥控激活**：手机扫码不仅能一键推源，还能直接粘贴激活码，秒激活大屏 Pro。
          - ⏪ **7天回看快进/快退进度条**：回看模式下 [左/右] 方向键 15 秒步进跳跃，实时 OSD 进度显示。
          - 🔢 **遥控器 0-9 数字键选台**：大屏右上角数字浮层，输入数字 1.4 秒自动切台或按确定直达。
          - 🎮 **经典 TiviMate 遥控交互**：方向键物理拦截，左拉分类抽屉，右拉 7 天回看。
          
          ### 📥 安装方式：
          下载下方的 APK 安装包，通过 U 盘或局域网助手直接安装到电视/机顶盒即可！
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
