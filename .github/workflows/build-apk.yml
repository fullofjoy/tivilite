name: Build TiviLite Android TV APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Build APK (Release & Debug with Fixed Signature)
      run: gradle assembleRelease --stacktrace || gradle assembleDebug --stacktrace

    - name: Prepare APK for Release
      run: |
        TAG_NAME="${{ github.ref_name }}"
        if [ -z "$TAG_NAME" ] || [ "$TAG_NAME" = "main" ]; then
          TAG_NAME="latest"
        fi
        APK_FOUND=$(find app/build/outputs/apk/ -type f -name "*.apk" | head -n 1)
        if [ -n "$APK_FOUND" ]; then
          echo "Found APK at $APK_FOUND"
          cp "$APK_FOUND" "TiviLite-${TAG_NAME}.apk"
          echo "APK_FILE=TiviLite-${TAG_NAME}.apk" >> $GITHUB_ENV
        else
          echo "No APK found in app/build/outputs/apk/"
          find . -name "*.apk"
          exit 1
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TiviLite-AndroidTV-APK
        path: ${{ env.APK_FILE }}
        retention-days: 30

    - name: Create GitHub Release on Tag
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: ${{ env.APK_FILE }}
        name: TiviLite ${{ github.ref_name }} (Android TV 纯净播放器)
        body: |
          ## 📺 TiviLite ${{ github.ref_name }} (纯净合规版)

          专为大屏打造的 Android TV / 电视机顶盒专用纯净 IPTV 播放器。

          ### ✨ v1.0.8 核心亮点与深度优化：
          - 🛡️ **100% 纯净播放器合规设计**：彻底清除内置广播电视频道，杜绝版权与封禁风险，完全符合广电与应用商店规范。
          - 🪄 **全新无源引导向导 (Onboarding Wizard)**：首次启动或未配置源时，自动展示高颜值扫码配对导流卡片，支持扫码推源及一键载入合规开源测试流。
          - ⭐ **频道收藏置顶系统 (Favorites)**：全屏播放或列表选台中，长按遥控器 [OK / 确定键] 即可一键收藏/取消收藏，分类抽屉置顶显示「⭐ 我的收藏」。
          - 🚀 **开机自启动设置开关**：设置菜单新增「开机自动直达直播」开关，开机即可看电视或按需关闭。
          - 💡 **新手遥控浮层指引**：启动自动提示经典操作快捷键，老幼皆可轻松上手。
          - 🔄 **官方稳定统一签名**：保持永久签名一致性，覆盖安装免卸载，支持应用内检测静默/在线升级。

          ### 📥 安装方式：
          下载下方的 APK 安装包，通过 U 盘或局域网助手直接安装到电视/机顶盒即可！
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
